name: Mindtalk
options:
  bundleIdPrefix: ai.mindact
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: sv
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.4
  # The helper `mindtalk` speaks MCP to Claude (Helper/). Linked into the helper only.
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1
targets:
  # Mindtalk i Claude: the helper inside the app (Contents/Helpers/mindtalk). It talks
  # to the running app over a local socket (Bridge.swift); it holds no app code.
  MindtalkHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    dependencies:
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: mindtalk
        PRODUCT_BUNDLE_IDENTIFIER: ai.mindact.mindtalk.helper
        # Local fork: sign with my own self-signed certificate, no Apple team.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "edrta913-local-dev"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        # A Debug build would otherwise move the code into Mindtalk.debug.dylib and
        # __preview.dylib; the hardened runtime's library validation rejects that pair
        # under a self-signed identity and dyld dies with "different Team IDs".
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        DEAD_CODE_STRIPPING: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: NO
  Mindtalk:
    type: application
    platform: macOS
    sources:
      - path: Mindtalk/Sources
      - path: Mindtalk/Resources
        optional: true
    dependencies:
      - package: FluidAudio
      # The helper, copied into Contents/Helpers and signed with the app.
      - target: MindtalkHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Mindtalk/Info.plist
      properties:
        CFBundleName: Mindtalk
        # Anything that isn't Swedish falls back to English.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [sv, en]
        CFBundleDisplayName: Mindtalk
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Mindact Solutions AB. Taligenkänning: Klang Pianissimo av Klang AI AB och Parakeet Ultra av Moondream (CC BY 4.0)."
        # "Öppna med › Mindtalk" for sound and video: transcribed as a meeting.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        # Meetings dragged onto a folder: a type of Mindtalk's own, so text from
        # elsewhere is never taken for a meeting.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ai.mindact.mindtalk.meeting
            UTTypeDescription: Mindtalk meeting
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
          - UTTypeIdentifier: ai.mindact.mindtalk.thought
            UTTypeDescription: Mindtalk thought
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        # mindtalk://meeting/<id>?t=<seconds>, mindtalk://thought/<id>, mindtalk://settings/claude:
        # Claude's answers link back into the app (Mindtalk i Claude).
        CFBundleURLTypes:
          - CFBundleURLName: ai.mindact.mindtalk
            CFBundleURLSchemes: [mindtalk]
        NSMicrophoneUsageDescription: "Mindtalk använder mikrofonen när du dikterar och när du spelar in möten. Allt tolkas på din Mac, och inget ljud lämnar datorn."
        NSAudioCaptureUsageDescription: "Mindtalk tar med datorns ljud i ett möte, så att det de andra säger i Teams, Zoom eller Meet också skrivs ned. Allt tolkas på din Mac, och inget ljud lämnar datorn."
        # EventKit asks for these by name: without one the request is refused quietly, with
        # no window and no error to see — the calendar never opens at all.
        NSCalendarsUsageDescription: "Mindtalk läser vilka möten som står i din kalender när du spelar in, så att mötets namn och de inbjudna följer med. Allt stannar på din Mac, och Mindtalk skriver aldrig något i kalendern."
        NSCalendarsFullAccessUsageDescription: "Mindtalk läser din kalender för att hitta mötet du spelar in — namnet, vem som är inbjuden och vad som står i inbjudan. Allt stannar på din Mac, och Mindtalk skriver aldrig något i kalendern."
    entitlements:
      path: Mindtalk/Mindtalk.entitlements
      properties:
        com.apple.security.device.audio-input: true
        # Hardened runtime, and no prompt at all without this one: tccd answers
        # "service: kTCCServiceCalendar requires entitlement
        # com.apple.security.personal-information.calendars but it is missing" and denies
        # the request in silence — no window, and EventKit reports neither error nor grant.
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_NAME: Mindtalk
        PRODUCT_BUNDLE_IDENTIFIER: ai.mindact.mindtalk
        # Local fork: sign with my own self-signed certificate, no Apple team.
        # Same identity on app + helper: grants survive rebuilds.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "edrta913-local-dev"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        # Same reason as in the helper target: no .debug.dylib to validate.
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: 15
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Mindtalk/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Icon Composer icon (Resources/AppIcon.icon): macOS 26+ draws it with Liquid Glass
        # and makes the dark and tinted variants; actool also writes a classic .icns.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Mindtalk's ink (black / white) instead of system blue on every native control.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: NO
